<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How Many?</title>
<meta name="theme-color" content="#c0861f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="How Many">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<style>
  /* Layout: maker mode is a settings card above a column of A4 sheet previews; each sheet prints in black and white as one wordless page of 1 or 2 counting scenes (a big framed box of scattered pictures with the answer QR code in a notch at its top right, and below it one answer box per kind of picture: the picture, then a box to write the number in or a row of dots to colour). Answer mode (the QR's #186… link) is one scene on a card, counted out loud in coloured badges. */
  :root{
    --ink:#1f2a44; --gold:#c0861f; --cream:#f7f1e3; --cream-dark:#e2d6b8;
    --go:#2fa34a; --red:#d4452f; --faint:#aab0bd;
    --read:Verdana,Tahoma,sans-serif;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --z:1;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--gold);color:var(--ink);font-family:var(--read);-webkit-tap-highlight-color:transparent;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  button,input,select{font:inherit;color:inherit;touch-action:manipulation}
  button{cursor:pointer}

  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- maker ---------- */
  main{max-width:860px;margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
            calc(28px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  header{padding-left:56px;min-height:44px;color:#fff}
  h1{font-family:var(--title);font-weight:400;font-size:clamp(30px,6vw,42px);letter-spacing:1px;line-height:1.1;margin:0;
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  header p{margin:6px 0 0;font-size:14px;line-height:1.45;opacity:.95}
  #controls{margin:16px 0 22px;background:var(--cream);border-radius:16px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px 14px}
  #controls label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold}
  #controls input,#controls select{height:44px;width:100%;border:2px solid var(--cream-dark);border-radius:10px;background:#fff;
    padding:0 10px;font-size:16px}
  .btns{grid-column:1/-1;display:flex;gap:10px}
  .btns button{flex:1;height:54px;border:0;border-radius:14px;color:#fff;font-family:var(--title);font-size:clamp(18px,5.4vw,24px);letter-spacing:1px;white-space:nowrap;
    padding-top:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #new{background:var(--red)}
  #print{background:var(--go)}

  #pages{display:flex;flex-direction:column;align-items:center;gap:22px}
  .page{position:relative}
  .reroll{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--cream);
    box-shadow:0 3px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
  .reroll svg{width:24px;height:24px}

  /* one printed A4 page; all sizes in mm so the preview is the print. --z shrinks the preview to fit a phone. */
  .sheet{zoom:var(--z);width:210mm;height:296.5mm;padding:12mm;background:#fff;overflow:hidden;
    display:grid;grid-template-columns:1fr;gap:8mm;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
  .slot svg{display:block}
  .hm .frame{fill:none;stroke:var(--ink);stroke-linejoin:round}
  .hm .item{fill:none;stroke:var(--ink)}
  .hm .box{fill:#fff;stroke:var(--ink)}
  .hm .base{stroke:var(--faint)}
  .hm .dot{fill:#fff;stroke:var(--ink)}
  .hm text{font-family:var(--read);font-weight:bold;text-anchor:middle;dominant-baseline:central}
  /* answer: each picture tints and gets its number in turn, then the kind's total shows below */
  .counting .obj [fill="#fff"]{animation:tint .25s var(--d) forwards}
  .counting .pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .35s cubic-bezier(.3,1.6,.6,1) var(--d) both}
  @keyframes tint{to{fill:var(--c)}}
  @keyframes pop{from{transform:scale(0);opacity:0}}

  /* ---------- answer ---------- */
  #answer{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .solved{width:min(100%,600px);background:#fff;border-radius:14px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.2);
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .solved svg{width:100%;height:auto;max-height:calc(100dvh - 150px);display:block;cursor:pointer}
  #make{color:#8a5a08;font-size:14px}
  body.answering #maker, body:not(.answering) #answer{display:none}

  /* ---------- print: only the sheets, one per page ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    #home,main>header,#controls,.reroll,#answer{display:none!important}
    main{padding:0;max-width:none}
    #pages{display:block}
    .sheet{zoom:1!important;box-shadow:none}
    .page:not(:last-child){break-after:page}
  }
</style>
</head>
<body>
<a id="home" href="../print.html" aria-label="All printables" title="All printables"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>

<main id="maker">
  <header>
    <h1>How Many?</h1>
    <p>Print a counting sheet. Your child counts each kind of picture in the big box, then writes the number (or colours that many dots) next to its picture underneath. Scan the QR code to watch them counted.</p>
  </header>
  <form id="controls" onsubmit="return false">
    <label>Kinds <select id="kinds"></select></label>
    <label>Up to <select id="upTo"></select></label>
    <label>Answer with
      <select id="answerBy"><option value="write">A number</option><option value="dots">Dots</option></select>
    </label>
    <label>Pictures <select id="theme"></select></label>
    <label>Per page
      <select id="perPage"><option value="1">1</option><option value="2">2</option></select>
    </label>
    <label>Pages <input id="sheets" type="number" inputmode="numeric"></label>
    <div class="btns"><button id="new" type="button">New scenes</button><button id="print" type="button">Print</button></div>
  </form>
  <div id="pages"></div>
</main>

<main id="answer"><div id="solved" class="solved"></div></main>

<script>
/* ======== tuning ======== */
const DEFAULTS = { kinds: 3, upTo: 10, answerBy: 'write', theme: '0', perPage: 1, sheets: 1 };
const KINDS = [2, 3, 4, 5];          // kinds of picture in a scene, offered in the list
const UP_TO = [5, 10, 15, 20];       // most of one kind, offered in the list
const SHEETS_MAX = 20;
const COUNT_LOW = 0.3;               // each kind's count is picked from (up to × this)…(up to), every kind a different count
const PIC_MAX = 20;                  // mm, biggest picture in the scene…
const PIC_MIN = 10;                  // …and smallest: "2 per page" is greyed out when the scenes would need smaller ones
const DENSITY = 0.46;                // share of the box the pictures (with their gaps) are sized to cover
const GAP = 2.5;                     // mm, least space between two pictures
const FRAME_GAP = 2;                 // mm, least space between a picture and the frame
const SIZE_SPREAD = 0.12;            // pictures are up to this much bigger or smaller than the scene's size
const TURN = 25;                     // degrees, most a picture is turned either way
const CANDIDATES = 24;               // spots tried for each picture (the one furthest from the others wins: an even spread)
const ANS_GAP = 6;                   // mm between the scene and the answer boxes
const ANS_PIC = 20;                  // mm, biggest picture in a "write the number" answer box
const BOX_W = 1.45;                  // the writing box's width, in pictures
const NUM_CELL_MIN = 40;             // mm, narrowest answer box before they go on two rows
const DOT_PIC = 12;                  // mm, picture beside a row of dots
const DOT_MAX = 9, DOT_GOOD = 7;     // mm, biggest dot, and the smallest that lets rows of dots sit side by side
const QR_SIZE = { 1: 24, 2: 22 };    // mm, smallest answer QR code by scenes per page…
const QR_MODULE = 0.4;               // …grown for crowded scenes so each QR dot is at least this many mm, for a phone camera
const COUNT_TIME = 14;               // s, about how long the answer page takes to count every picture…
const STEP_MIN = 0.16, STEP_MAX = 0.5;   // …but each number takes at least / at most this long
const KIND_PAUSE = 0.9;              // s, pause after each kind, while its total shows
const COLOURS = ['#e0533d', '#2b7bd6', '#2fa34a', '#9b51c9', '#e08a00'];   // answer page, by kind: badges and totals…
const TINTS = ['#ffd2c9', '#cfe2fb', '#cdeed5', '#ebd6f8', '#ffe2ad'];     // …and the counted pictures
const PUBLIC_URL = 'https://tb-x.github.io/how-many/';   // where the QR points when the maker isn't on GitHub Pages

/* ======== small helpers ======== */
const $ = (id) => document.getElementById(id);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rint(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (n) => Array.from({ length: n }, (_, i) => i);
const sum = (a) => a.reduce((s, v) => s + v, 0);
const f = (x) => +x.toFixed(2);
const pad = (v, n) => String(v).padStart(n, '0');
const polar = (r, deg, cx = 0, cy = 0) => [f(cx + r * Math.cos(deg * Math.PI / 180)), f(cy + r * Math.sin(deg * Math.PI / 180))];

/* ======== settings (remembered per browser) ======== */
const KEY = 'howmany.settings';
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { /* blocked on file:// */ }
const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch { /* ignore */ } };
const clamp = (v, a, b, d) => (Number.isFinite(+v) && v !== '' ? Math.min(b, Math.max(a, Math.round(+v))) : d);

/* ======== pictures ======== */
// Each is drawn in a 100 × 100 box centred on 0,0, as black lines on white, for a black-and-white printer
// (and so a child can colour them in). They're printed 10 to 20 mm big, so the lines are bold and the details few.
const INK = '#1f2a44';
const STROKE = `fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"`;
const LINE = (w) => `fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const DOT = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/>`;
const mirror = (s) => `${s}<g transform="scale(-1 1)">${s}</g>`;
// an Archimedean spiral out from cx, cy
const spiral = (cx, cy, r, turns, start = 0) => range(turns * 16 + 1).map((i) => {
  const t = i / (turns * 16), [x, y] = polar(r * t, start + t * turns * 360, cx, cy);
  return `${i ? 'L' : 'M'}${x} ${y}`;
}).join('');
// a puffy outline: n bumps around an ellipse
const cloud = (cx, cy, rx, ry, n, bulge = 0.62, start = 0) => {
  const p = range(n).map((i) => [f(cx + rx * Math.cos((start + i * 360 / n) * Math.PI / 180)), f(cy + ry * Math.sin((start + i * 360 / n) * Math.PI / 180))]);
  return `M${p[0].join(' ')}` + p.map((a, i) => {
    const b = p[(i + 1) % n], r = f(Math.hypot(b[0] - a[0], b[1] - a[1]) * bulge);
    return `A${r} ${r} 0 0 1 ${b.join(' ')}`;
  }).join('') + 'z';
};

const starPath = () => range(10).map((i) => {
  const [x, y] = polar(i % 2 ? 19 : 47, i * 36 - 90, 0, 4);
  return `${i ? 'L' : 'M'}${x} ${y}`;
}).join('') + 'z';

// --- garden
const petals = range(5).map((k) => { const [x, y] = polar(24, k * 72 - 90, 0, 2); return `<circle cx="${x}" cy="${y}" r="16" ${STROKE}/>`; }).join('');
const FLOWER = `<path d="M0 22V48" ${LINE(5)}/><path d="M0 40C-14 30-24 34-26 40-16 46-6 44 0 40z" ${STROKE}/>
  <g transform="translate(0 -10) scale(.8)">${petals}<circle cy="2" r="13" ${STROKE}/></g>`;
const BEE = `<ellipse cx="-8" cy="-24" rx="13" ry="19" transform="rotate(-22 -8 -24)" ${STROKE}/>
  <ellipse cx="10" cy="-24" rx="12" ry="18" transform="rotate(22 10 -24)" ${STROKE}/>
  <path d="M-36 3-49 8-36 13z" fill="${INK}"/>
  <ellipse cx="0" cy="8" rx="38" ry="24" ${STROKE}/>
  <path d="M-14-14V30M4-15V31" stroke="${INK}" stroke-width="8"/>
  <circle cx="22" cy="2" r="4" fill="${INK}"/><path d="M21 15q6 4 11-2" ${LINE(3)}/>
  <path d="M27-12q3-14 14-17" ${LINE(4)}/>`;
const BUTTERFLY = mirror(`<path d="M-4-4C-14-42-48-50-48-22-48-6-30 0-4 0z" ${STROKE}/>
  <path d="M-4 3C-30 4-44 22-36 37-27 48-8 34-4 9z" ${STROKE}/><circle cx="-29" cy="-21" r="7" ${STROKE}/>`)
  + `<ellipse cy="2" rx="6.5" ry="30" ${STROKE}/><path d="M-3-26Q-8-40-17-44M3-26Q8-40 17-44" ${LINE(3.5)}/>${DOT(-17, -44, 4)}${DOT(17, -44, 4)}`;
const LADYBIRD = `<path d="M-8-36-16-48M8-36 16-48" ${LINE(4)}/>
  <path d="M-34-6-46-12M-36 8H-48M-32 24-44 30M34-6 46-12M36 8H48M32 24 44 30" ${LINE(4)}/>
  <circle cy="-27" r="15" fill="${INK}"/><circle cy="7" r="36" ${STROKE}/><path d="M0-29V43" ${LINE(4)}/>
  ${DOT(-17, -9, 6.5)}${DOT(17, -9, 6.5)}${DOT(-22, 14, 6)}${DOT(22, 14, 6)}${DOT(-11, 32, 5.5)}${DOT(11, 32, 5.5)}`;
const SNAIL = `<path d="M-36-12-43-31M-30-12-27-31" ${LINE(4)}/>${DOT(-43, -32, 4.5)}${DOT(-27, -32, 4.5)}
  <path d="M-44 36C-50 20-46-14-33-14-21-14-22 4-20 20H32L48 34Q48 36 44 36z" ${STROKE}/>
  <circle cx="10" cy="-2" r="27" ${STROKE}/><path d="${spiral(10, -2, 21, 2.3, 200)}" ${LINE(4)}/>${DOT(-36, -4, 3.5)}`;
const MUSHROOM = `<path d="M-16 0-20 38Q0 46 20 38L16 0z" ${STROKE}/><path d="M-47 6C-49-42 49-42 47 6z" ${STROKE}/>
  <circle cx="-25" cy="-9" r="7" ${STROKE}/><circle cx="1" cy="-21" r="8" ${STROKE}/><circle cx="25" cy="-8" r="6.5" ${STROKE}/>`;

// --- sea
const FISH = `<path d="M26 0 48-21Q41 0 48 21z" ${STROKE}/><path d="M-10-20Q4-38 18-19" ${STROKE}/>
  <path d="M-47 0C-31-31 18-31 33 0 18 31-31 31-47 0z" ${STROKE}/>
  ${DOT(-27, -5, 4.5)}<path d="M-12-14Q-4 0-12 14" ${LINE(4)}/>`;
const fanPts = range(7).map((i) => polar(72, -126 + i * 12, 0, 32));
const SHELL = `<path d="M-15 24-19 42H19L15 24z" ${STROKE}/>
  <path d="M0 32L${fanPts[0].join(' ')}${fanPts.slice(1).map((p) => `A7.8 7.8 0 0 1 ${p.join(' ')}`).join('')}z" ${STROKE}/>
  <path d="${fanPts.slice(1, -1).map(([x, y]) => `M0 32L${f(x * 0.92)} ${f(32 + (y - 32) * 0.92)}`).join('')}" ${LINE(3.5)}/>`;
const STARFISH = `<path d="M${polar(20, -126, 0, 4).join(' ')}${range(5).map((i) => `Q${polar(76, -90 + i * 72, 0, 4).join(' ')} ${polar(20, -54 + i * 72, 0, 4).join(' ')}`).join('')}z" ${STROKE}/>
  ${range(5).map((i) => DOT(...polar(26, -90 + i * 72, 0, 4), 3.5)).join('')}<circle cy="4" r="5" ${STROKE}/>`;
const claw = (cx, cy, open) => {
  const [ax, ay] = polar(12, open + 28, cx, cy), [bx, by] = polar(12, open - 28, cx, cy);
  return `<path d="M${ax} ${ay}A12 12 0 1 1 ${bx} ${by}L${f(cx)} ${f(cy + 2)}z" ${STROKE}/>`;
};
const CRAB = mirror(`<path d="M-22 12-43 4M-22 20-45 22M-19 27-38 38" ${LINE(4.5)}/><path d="M-20-2-30-16" ${LINE(5)}/>
  <path d="M-8-4V-20" ${LINE(4)}/>`)
  + claw(-33, -27, -60) + claw(33, -27, -120)
  + `<ellipse cy="12" rx="31" ry="20" ${STROKE}/>${DOT(-8, -22, 5)}${DOT(8, -22, 5)}<path d="M-9 15Q0 22 9 15" ${LINE(3.5)}/>`;
const tube = (d) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="15" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>`;
const OCTOPUS = [-26, -13, 0, 13, 26].map((x) => tube(`M${x} 2Q${f(x * 1.3 + 9)} 20 ${f(x * 1.5)} 28T${f(x * 1.7)} 42`)).join('')
  + `<path d="M-31 10C-39-48 39-48 31 10z" ${STROKE}/>${DOT(-11, -12, 5)}${DOT(11, -12, 5)}<path d="M-8 0Q0 6 8 0" ${LINE(3.5)}/>`;
const hexPts = range(6).map((i) => polar(13, i * 60, 0, 4));
const TURTLE = mirror(`<ellipse cx="-31" cy="-18" rx="9" ry="17" transform="rotate(-55 -31 -18)" ${STROKE}/>
  <ellipse cx="-27" cy="28" rx="7" ry="12" transform="rotate(40 -27 28)" ${STROKE}/>`)
  + `<path d="M-6 36 0 48 6 36z" ${STROKE}/><circle cy="-38" r="11" ${STROKE}/>${DOT(-5, -41, 2.8)}${DOT(5, -41, 2.8)}
  <ellipse cy="4" rx="30" ry="35" ${STROKE}/><path d="M${hexPts.map((p) => p.join(' ')).join('L')}z" ${LINE(3.5)}/>
  <path d="${hexPts.map(([x, y], i) => `M${x} ${y}L${f(30 * Math.cos(i * Math.PI / 3))} ${f(4 + 35 * Math.sin(i * Math.PI / 3))}`).join('')}" ${LINE(3.5)}/>`;

// --- space
const STAR = `<path d="${starPath()}" ${STROKE}/>`;
const MOON = `<g transform="translate(9 0)"><path d="M22-37.6A40 40 0 1 0 22 37.6 42 42 0 0 1 22-37.6z" ${STROKE}/>
  <circle cx="-22" cy="-8" r="6" ${STROKE}/><circle cx="-14" cy="18" r="4.5" ${STROKE}/></g>`;
const ROCKET = `<path d="M-15 12-32 38-14 31z" ${STROKE}/><path d="M15 12 32 38 14 31z" ${STROKE}/>
  <path d="M-10 33Q0 54 10 33z" ${STROKE}/>
  <path d="M0-47C19-30 19 6 14 34H-14C-19 6-19-30 0-47z" ${STROKE}/>
  <circle cy="-10" r="9" ${STROKE}/>`;
const RING = 'M-48 0A48 14 0 1 0 48 0A48 14 0 1 0-48 0zM-35 0A35 7 0 1 1 35 0A35 7 0 1 1-35 0z';
const PLANET = `<g transform="rotate(-20)"><path d="${RING}" fill-rule="evenodd" ${STROKE}/><circle r="27" ${STROKE}/>
  <path d="M-48 0A48 14 0 0 0 48 0H35A35 7 0 0 1-35 0z" ${STROKE}/></g><path d="M-14-17Q-4-24 8-22" ${LINE(3.5)}/>`;
const UFO = `<path d="M-20 16-28 32M20 16 28 32" ${LINE(5)}/><path d="M0-28V-40" ${LINE(4)}/>${DOT(0, -42, 4.5)}
  <path d="M-23-2A23 27 0 0 1 23-2z" ${STROKE}/><ellipse cy="7" rx="47" ry="15" ${STROKE}/>
  ${DOT(-27, 8, 4.5)}${DOT(0, 11, 4.5)}${DOT(27, 8, 4.5)}`;
const COMET = `<path d="M7-33Q-22 0-47 43Q-2 22 39-5z" ${STROKE}/><path d="M4-10-26 22M18 0-10 24" ${LINE(3.5)}/>
  <circle cx="24" cy="-21" r="18" ${STROKE}/>`;

// --- farm
const PIG = mirror(`<path d="M-37-17-38-48-13-36z" ${STROKE}/>`)
  + `<ellipse cy="4" rx="41" ry="36" ${STROKE}/><ellipse cy="15" rx="17" ry="12" ${STROKE}/>
  <ellipse cx="-6" cy="15" rx="3" ry="5" fill="${INK}"/><ellipse cx="6" cy="15" rx="3" ry="5" fill="${INK}"/>
  ${DOT(-16, -10, 4.5)}${DOT(16, -10, 4.5)}`;

// the kinds of picture in each scene theme. A picture's number in the answer link is its theme's index × 10 + its
// index here, so only ever add themes and pictures to the end
const THEMES = [
  { name: 'Garden', pics: [FLOWER, BEE, BUTTERFLY, LADYBIRD, SNAIL, MUSHROOM] },
  { name: 'Sea', pics: [FISH, SHELL, STARFISH, CRAB, OCTOPUS, TURTLE] },
  { name: 'Space', pics: [STAR, MOON, ROCKET, PLANET, UFO, COMET] },
  { name: 'Farm', pics: [PIG, CHICK, SHEEP, CARROT, TRACTOR, APPLE] },
  { name: 'Sweets', pics: [LOLLIPOP, SWEET, CUPCAKE, ICECREAM, DONUT, CAKE] },
];
const LOOKALIKE = [[20, 12]];   // pictures that never share a scene in "A mix" (star and starfish)
const picOf = (id) => THEMES[Math.floor(id / 10)]?.pics[id % 10];
const pic = (inner, x, y, s, a = 0) => `<g transform="translate(${f(x)} ${f(y)})${a ? ` rotate(${f(a)})` : ''} scale(${f(s / 100)})">${inner}</g>`;

// k different pictures from a theme, or with "A mix" one from each of k different themes
function pickPics(k, theme) {
  if (theme !== 'mix') return shuffle(range(THEMES[+theme].pics.length)).slice(0, k).map((i) => +theme * 10 + i);
  for (;;) {
    const ids = shuffle(range(THEMES.length)).slice(0, k).map((t) => t * 10 + rint(0, THEMES[t].pics.length - 1));
    if (!LOOKALIKE.some((pair) => pair.every((id) => ids.includes(id)))) return ids;
  }
}

/* ======== scene: counts and scatter ======== */
// a different count for each kind, from the top two thirds or so of 1…upTo
function makeCounts(k, upTo) {
  const lo = Math.min(Math.max(1, Math.ceil(upTo * COUNT_LOW)), upTo - k + 1);
  return shuffle(range(upTo - lo + 1).map((i) => lo + i)).slice(0, k);
}
const mostPictures = (k, upTo) => sum(range(k).map((i) => upTo - i));

// Every picture sits on a 100 × 100 grid inside the frame (so the answer link can say where with 2 digits each way)
// with a turn from 0 to 9 (-TURN…+TURN degrees). Its size wobble comes from those same digits, so the link needn't
// carry it. size is the scene's picture size in mm.
const wobble = (o) => 1 + SIZE_SPREAD * (((o.gx * 7 + o.gy * 13 + o.r * 3) % 10) / 4.5 - 1);
function place(o, W, H, size) {
  const m = size * (1 + SIZE_SPREAD) / 2 + FRAME_GAP, s = size * wobble(o);
  return { x: m + o.gx * (W - 2 * m) / 99, y: m + o.gy * (H - 2 * m) / 99, s, rad: s / 2, a: (o.r - 4.5) * TURN / 4.5 };
}
// the QR code's notch in the top right corner of the frame
const NOTCH_GAP = 2.5, FRAME_R = 5;
const notch = (W, Q) => ({ x: W - Q - NOTCH_GAP, y: Q + NOTCH_GAP });

// Best-candidate sampling: for each picture try a few random spots and keep the one furthest from the pictures
// already placed. That spreads them out evenly without lining them up. null when one won't fit.
function scatter(W, H, Q, size, counts) {
  const n = Q ? notch(W, Q) : null, placed = [];
  for (const k of shuffle(counts.flatMap((c, k) => Array(c).fill(k)))) {
    let best = null, bestGap = -1;
    for (let t = 0; t < CANDIDATES || (!best && t < CANDIDATES * 40); t++) {
      const o = { k, gx: rint(0, 99), gy: rint(0, 99), r: rint(0, 9) }, p = place(o, W, H, size);
      if (n && Math.hypot(Math.max(0, n.x - p.x), Math.max(0, p.y - n.y)) < p.rad + FRAME_GAP) continue;
      let gap = Infinity;
      for (const q of placed) { gap = Math.min(gap, Math.hypot(q.x - p.x, q.y - p.y) - q.rad - p.rad); if (gap < GAP) break; }
      if (gap >= GAP && gap > bestGap) { bestGap = gap; best = Object.assign(o, p); }
    }
    if (!best) return null;
    placed.push(best);
  }
  return placed.sort((a, b) => a.k - b.k).map(({ k, gx, gy, r }) => ({ k, gx, gy, r }));
}

// the picture size that fills a W × H scene (less the QR notch) with n pictures
function picSize(W, H, Q, n) {
  const area = (W - 2 * FRAME_GAP) * (H - 2 * FRAME_GAP) - (Q ? (Q + NOTCH_GAP) ** 2 : 0);
  return Math.min(PIC_MAX, Math.sqrt(area * DENSITY / n) - GAP);
}

/* ======== answer boxes ======== */
// Where the answer boxes go under a W mm wide scene: one per kind, each a rounded box holding the kind's picture and
// either a box to write in (write) or a row of upTo dots in fives (dots). Returns their height and each one's parts.
const PAD = 2.5, IG = 4;   // mm inside an answer box, and between them
function answerLayout(W, k, by, upTo) {
  const items = [];
  let cols, rowH;
  const cell = (c) => (W - (c - 1) * IG) / c;
  if (by === 'write') {
    cols = cell(k) >= NUM_CELL_MIN ? k : Math.ceil(k / 2);
    const cw = cell(cols), P = Math.min(ANS_PIC, (cw - 2 * PAD - 3) / (1 + BOX_W)), bw = P * BOX_W, bh = P * 1.1;
    const w = 2 * PAD + P + 3 + bw;
    rowH = bh + 2 * PAD;
    for (let i = 0; i < k; i++) items.push({ w, h: rowH, P, box: { x: PAD + P + 3, y: PAD, w: bw, h: bh } });
  } else {
    const units = upTo + 0.35 * (upTo - 1) + 0.9 * (Math.ceil(upTo / 5) - 1);   // a row of dots, in dots
    const dotFor = (c) => Math.min(DOT_MAX, (cell(c) - 2 * PAD - DOT_PIC - 4) / units);
    cols = 1;
    for (let c = k; c > 1; c--) if (dotFor(c) >= DOT_GOOD) { cols = c; break; }
    const d = dotFor(cols), P = DOT_PIC;
    rowH = Math.max(P, d) + 2 * PAD;
    const dots = range(upTo).map((j) => ({ cx: f(PAD + P + 4 + d / 2 + j * d * 1.35 + Math.floor(j / 5) * d * 0.9), cy: f(rowH / 2) }));
    const w = 2 * PAD + P + 4 + units * d;
    for (let i = 0; i < k; i++) items.push({ w, h: rowH, P, d, dots });
  }
  const rows = Math.ceil(k / cols), cw = cell(cols);
  items.forEach((it, i) => {
    const r = Math.floor(i / cols), inRow = Math.min(cols, k - r * cols), c = i - r * cols;
    const x0 = (W - inRow * cw - (inRow - 1) * IG) / 2;
    it.x = x0 + c * (cw + IG) + (cw - it.w) / 2;
    it.y = r * (rowH + IG);
  });
  return { h: rows * rowH + (rows - 1) * IG, items };
}

/* ======== answer link and QR code ======== */
// #186214112010 3 0408 1110 2205 ... : scene width and height (mm), picture size (tenths of a mm), answer style
// (0 write, 1 dots), up to, kinds, then each kind's picture and count, then every picture as x, y and turn
// (2 + 2 + 1 digits), kind by kind. All digits, so they go into the QR code in its numeric mode, which packs them
// tightly enough for a phone camera to read even a crowded scene.
function answerDigits(p) {
  return pad(p.W, 3) + pad(p.H, 3) + pad(Math.round(p.size * 10), 3) + (p.by === 'dots' ? 1 : 0) + pad(p.upTo, 2) + p.kinds.length
    + p.kinds.map((kd) => pad(kd.pic, 2) + pad(kd.n, 2)).join('') + p.objs.map((o) => pad(o.gx, 2) + pad(o.gy, 2) + o.r).join('');
}
const answerBase = () => (location.hostname.endsWith('github.io') ? location.origin + location.pathname : PUBLIC_URL);

function parseHash() {
  const m = /^#(\d{17,})$/.exec(location.hash);
  if (!m) return null;
  const s = m[1];
  let i = 0;
  const take = (n) => +s.slice(i, i += n);
  const W = take(3), H = take(3), size = take(3) / 10, by = take(1), upTo = take(2), k = take(1);
  if (W < 40 || W > 300 || H < 30 || H > 300 || size < 3 || size > 40 || by > 1 || !UP_TO.includes(upTo) || !KINDS.includes(k)) return null;
  const kinds = range(k).map(() => ({ pic: take(2), n: take(2) }));
  if (kinds.some((kd) => !picOf(kd.pic) || kd.n < 1 || kd.n > upTo) || s.length !== i + 5 * sum(kinds.map((kd) => kd.n))) return null;
  const objs = kinds.flatMap((kd, ki) => range(kd.n).map(() => ({ k: ki, gx: take(2), gy: take(2), r: take(1) })));
  return { W, H, size, by: by ? 'dots' : 'write', upTo, kinds, objs, Q: 0 };
}

// the QR code for an answer link: the address as text, the scene as numbers
function qrFor(digits) {
  const q = qrcode(0, 'M');
  q.addData(answerBase() + '#');
  q.addData(digits, 'Numeric');
  q.make();
  return q;
}
// how many mm the QR code for a link of this many digits needs
const qrNeedCache = {};
function qrNeed(len) {
  if (typeof qrcode !== 'function') return 0;
  return (qrNeedCache[len] ??= (qrFor('9'.repeat(len)).getModuleCount() + 2) * QR_MODULE);
}

// the QR code as SVG, s mm square at x, y; on screen it's also a link to the answer
function qrSvg(digits, x, y, s) {
  if (typeof qrcode !== 'function') return '';   // library didn't load
  const q = qrFor(digits);
  const n = q.getModuleCount(), pd = 1, t = n + 2 * pd;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pd} ${r + pd}h1v1h-1z`;
  return `<a href="#${digits}" target="_blank"><g transform="translate(${f(x)} ${f(y)}) scale(${f(s / t)})">
    <rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000" shape-rendering="crispEdges"/></g></a>`;
}

/* ======== drawing one scene ======== */
// the frame, with a notch cut out of its top right corner for the QR code when Q > 0
function framePath(W, H, Q) {
  const r = FRAME_R, c = 3, end = `V${H - r}A${r} ${r} 0 0 1 ${W - r} ${H}H${r}A${r} ${r} 0 0 1 0 ${H - r}V${r}A${r} ${r} 0 0 1 ${r} 0z`;
  if (!Q) return `M${r} 0H${W - r}A${r} ${r} 0 0 1 ${W} ${r}${end}`;
  const { x: a, y: b } = notch(W, Q);
  return `M${r} 0H${f(a - c)}A${c} ${c} 0 0 1 ${f(a)} ${c}V${f(b - c)}A${c} ${c} 0 0 0 ${f(a + c)} ${f(b)}H${W - r}A${r} ${r} 0 0 1 ${W} ${f(b + r)}${end}`;
}

// the order to count a kind in: start at the top left one, then always the nearest one not yet counted
function countOrder(list) {
  const left = list.slice(), out = [];
  let cur = left.reduce((a, b) => (b.x + b.y < a.x + a.y ? b : a));
  while (left.length) {
    out.push(cur);
    left.splice(left.indexOf(cur), 1);
    if (left.length) cur = left.reduce((a, b) => (Math.hypot(b.x - cur.x, b.y - cur.y) < Math.hypot(a.x - cur.x, a.y - cur.y) ? b : a));
  }
  return out;
}

// returns an <svg> sized in mm. opts: qr (answer QR code in the notch), answer (counted, with the totals filled in)
function sceneSvg(p, opts) {
  const { W, H } = p, Q = opts.qr ? p.Q : 0, k = p.kinds.length, ans = answerLayout(W, k, p.by, p.upTo);
  const top = H + ANS_GAP, HT = top + ans.h;
  const objs = p.objs.map((o) => Object.assign({ ...o }, place(o, W, H, p.size)));
  let s = `<svg class="hm${opts.answer ? ' counting' : ''}" width="${f(W)}mm" height="${f(HT)}mm" viewBox="-1 -1 ${f(W + 2)} ${f(HT + 2)}" aria-hidden="true">`;
  s += `<path class="frame" stroke-width="0.9" d="${framePath(W, H, Q)}"/>`;
  if (Q) s += qrSvg(answerDigits(p), W - Q, 0, Q);

  // the answer: number each kind in turn, in counting order
  const done = [];
  if (opts.answer) {
    const step = Math.min(STEP_MAX, Math.max(STEP_MIN, COUNT_TIME / objs.length));
    let t = 0.6;
    for (let ki = 0; ki < k; ki++) {
      countOrder(objs.filter((o) => o.k === ki)).forEach((o, j) => { o.d = t; o.no = j + 1; t += step; });
      done[ki] = t;
      t += KIND_PAUSE;
    }
  }
  for (const o of objs) {
    const style = opts.answer ? ` style="--d:${f(o.d)}s;--c:${TINTS[o.k]}"` : '';
    s += `<g class="obj"${style}>${pic(picOf(p.kinds[o.k].pic), o.x, o.y, o.s, o.a)}</g>`;
  }
  if (opts.answer) for (const o of objs) {
    const r = Math.max(2.4, p.size * 0.3), fs = r * (o.no > 9 ? 1.05 : 1.3), bx = o.x + p.size * 0.32, by = o.y - p.size * 0.32;
    s += `<g class="pop" style="--d:${f(o.d)}s"><circle cx="${f(bx)}" cy="${f(by)}" r="${f(r)}" fill="${COLOURS[o.k]}" stroke="#fff" stroke-width="${f(r * 0.18)}"/>
      <text x="${f(bx)}" y="${f(by + fs * 0.05)}" font-size="${f(fs)}" fill="#fff">${o.no}</text></g>`;
  }

  // the answer boxes
  ans.items.forEach((it, ki) => {
    const x = it.x, y = top + it.y;
    s += `<rect class="item" stroke-width="0.4" x="${f(x)}" y="${f(y)}" width="${f(it.w)}" height="${f(it.h)}" rx="3"/>`;
    s += pic(picOf(p.kinds[ki].pic), x + PAD + it.P / 2, y + it.h / 2, it.P);
    const n = p.kinds[ki].n, d = opts.answer ? f(done[ki] + 0.1) : 0;
    if (it.box) {
      const b = it.box;
      s += `<rect class="box" stroke-width="0.7" x="${f(x + b.x)}" y="${f(y + b.y)}" width="${f(b.w)}" height="${f(b.h)}" rx="2"/>`;
      s += `<path class="base" stroke-width="0.45" d="M${f(x + b.x + 2.5)} ${f(y + b.y + b.h * 0.8)}h${f(b.w - 5)}"/>`;
      if (opts.answer) s += `<text class="pop" style="--d:${d}s" x="${f(x + b.x + b.w / 2)}" y="${f(y + b.y + b.h * 0.5)}" font-size="${f(b.h * 0.72)}" fill="${COLOURS[ki]}">${n}</text>`;
    } else {
      for (const [j, dt] of it.dots.entries()) {
        s += `<circle class="dot" stroke-width="0.5" cx="${f(x + dt.cx)}" cy="${f(y + dt.cy)}" r="${f(it.d / 2 - 0.25)}"/>`;
        if (opts.answer && j < n) s += `<circle class="pop" style="--d:${f(d + j * 0.05)}s" cx="${f(x + dt.cx)}" cy="${f(y + dt.cy)}" r="${f(it.d / 2 - 0.25)}" fill="${COLOURS[ki]}"/>`;
      }
    }
  });
  return s + '</svg>';
}

/* ======== maker: sheets ======== */
let pages = [];   // each page is a list of scenes
const SHEET_W = 186, SHEET_H = 272.5, GAP_PAGE = 8;   // mm inside the page margins

// the scene size, QR size and picture size for some settings (n: the most pictures a scene can have)
function layout(st = settings) {
  const k = st.kinds, slotH = (SHEET_H - (st.perPage - 1) * GAP_PAGE) / st.perPage, n = mostPictures(k, st.upTo);
  const ans = answerLayout(SHEET_W, k, st.answerBy, st.upTo), W = SHEET_W, H = Math.floor(slotH - ans.h - ANS_GAP);
  const Q = Math.max(QR_SIZE[st.perPage], qrNeed(13 + 4 * k + 5 * n));
  return { W, H, Q, smallest: picSize(W, H, Q, n) };
}
const perPageFits = (pp) => pp === 1 || layout({ ...settings, perPage: pp }).smallest >= PIC_MIN;

function makeScene(pics) {
  const { W, H, Q } = layout(), k = settings.kinds;
  for (;;) {
    const counts = makeCounts(k, settings.upTo);
    let size = Math.round(picSize(W, H, Q, sum(counts)) * 10) / 10;
    for (let tries = 0; tries < 8; tries++, size = Math.round(size * 9.4) / 10) {
      const objs = scatter(W, H, Q, size, counts);
      if (objs) return { W, H, Q, size, by: settings.answerBy, upTo: settings.upTo, kinds: counts.map((n, i) => ({ pic: pics[i], n })), objs };
    }
  }
}
const makePage = () => range(settings.perPage).map(() => makeScene(pickPics(settings.kinds, settings.theme)));

function sheetHtml(scenes) {
  const slots = scenes.map((p) => `<div class="slot">${sceneSvg(p, { qr: true })}</div>`).join('');
  return `<div class="sheet" style="grid-template-rows:repeat(${scenes.length},1fr)">${slots}</div>`;
}

const REROLL = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v6h-6" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderPages() {
  $('pages').innerHTML = pages.map((scs, i) => `<div class="page">${sheetHtml(scs)}
    <button class="reroll" data-i="${i}" aria-label="New scenes for this page" title="New scenes for this page">${REROLL}</button></div>`).join('');
  fitPages();
}

// shrink the A4 previews to the screen width (print resets the zoom)
function fitPages() {
  const sheetPx = 210 * 96 / 25.4;
  document.documentElement.style.setProperty('--z', Math.min(1, $('pages').clientWidth / sheetPx).toFixed(3));
}

function readControls() {
  const theme = $('theme').value;
  settings = {
    kinds: KINDS.includes(+$('kinds').value) ? +$('kinds').value : DEFAULTS.kinds,
    upTo: UP_TO.includes(+$('upTo').value) ? +$('upTo').value : DEFAULTS.upTo,
    answerBy: $('answerBy').value === 'dots' ? 'dots' : 'write',
    theme: theme === 'mix' || THEMES[+theme] ? theme : DEFAULTS.theme,
    perPage: +$('perPage').value === 2 ? 2 : 1,
    sheets: clamp($('sheets').value, 1, SHEETS_MAX, DEFAULTS.sheets),
  };
  writeControls();
  saveSettings();
}
function writeControls() {
  if (!KINDS.includes(settings.kinds)) settings.kinds = DEFAULTS.kinds;
  if (!UP_TO.includes(settings.upTo)) settings.upTo = DEFAULTS.upTo;
  if (settings.answerBy !== 'dots') settings.answerBy = 'write';
  if (settings.theme !== 'mix' && !THEMES[+settings.theme]) settings.theme = DEFAULTS.theme;
  settings.theme = String(settings.theme);
  if (settings.perPage !== 2) settings.perPage = 1;
  const two = perPageFits(2);
  $('perPage').options[1].disabled = !two;
  if (!two) settings.perPage = 1;
  settings.sheets = clamp(settings.sheets, 1, SHEETS_MAX, DEFAULTS.sheets);
  for (const k of ['kinds', 'upTo', 'answerBy', 'theme', 'perPage', 'sheets']) $(k).value = settings[k];
  $('sheets').min = 1; $('sheets').max = SHEETS_MAX;
}

function newAll() { pages = range(settings.sheets).map(makePage); renderPages(); }

function startMaker() {
  $('kinds').innerHTML = KINDS.map((k) => `<option value="${k}">${k}</option>`).join('');
  $('upTo').innerHTML = UP_TO.map((n) => `<option value="${n}">${n} each</option>`).join('');
  $('theme').innerHTML = THEMES.map((t, i) => `<option value="${i}">${t.name}</option>`).join('') + '<option value="mix">A mix</option>';
  writeControls();
  for (const k of ['kinds', 'upTo', 'answerBy', 'perPage']) $(k).addEventListener('change', () => { readControls(); newAll(); });
  $('theme').addEventListener('change', () => {   // same scenes, new pictures
    readControls();
    for (const p of pages.flat()) pickPics(p.kinds.length, settings.theme).forEach((id, i) => { p.kinds[i].pic = id; });
    renderPages();
  });
  $('sheets').addEventListener('change', () => {   // keep the pages already made, add or drop at the end
    readControls();
    pages = pages.slice(0, settings.sheets);
    while (pages.length < settings.sheets) pages.push(makePage());
    renderPages();
  });
  $('new').addEventListener('click', () => { readControls(); newAll(); });
  $('print').addEventListener('click', () => { readControls(); window.print(); });
  $('pages').addEventListener('click', (e) => {
    const b = e.target.closest('.reroll');
    if (!b) return;
    pages[+b.dataset.i] = makePage();
    renderPages();
  });
  addEventListener('resize', fitPages);
  newAll();
}

/* ======== answer page ======== */
// the scene counted kind by kind, each total showing in its box as that kind finishes; tap it to count again
function showAnswer(p) {
  document.body.classList.add('answering');
  const draw = () => { $('solved').innerHTML = `${sceneSvg(p, { answer: true })}<a id="make" href="./">Make new counting pages</a>`; };
  draw();
  $('solved').addEventListener('click', (e) => { if (e.target.closest('svg')) draw(); });
}

/* ======== start ======== */
function route() {
  const p = parseHash();
  if (p) showAnswer(p);
  else { document.body.classList.remove('answering'); if (!pages.length) startMaker(); }
}
addEventListener('hashchange', () => location.reload());
route();
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// the QR library) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
